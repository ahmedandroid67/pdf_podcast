server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Serve hashed frontend assets directly. If an asset is missing, return 404
    # instead of falling back to index.html, which would break CSS/JS loading.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Serve top-level static app files directly.
    location = /manifest.webmanifest { try_files $uri =404; }
    location = /sw.js { try_files $uri =404; add_header Cache-Control "no-cache"; }
    location = /workbox-d513b99b.js { try_files $uri =404; }
    location = /pwa-192.svg { try_files $uri =404; }
    location = /pwa-512.svg { try_files $uri =404; }
    location = /pwa-maskable.svg { try_files $uri =404; }
    location = /favicon.svg { try_files $uri =404; }
    location = /icons.svg { try_files $uri =404; }
    location = /screenshot-wide.svg { try_files $uri =404; }
    location = /screenshot-mobile.svg { try_files $uri =404; }

    # Proxy API requests to the backend service.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /auth/ {
        proxy_pass http://backend:8000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /audio/ {
        proxy_pass http://backend:8000/audio/;
        proxy_set_header Host $host;
    }

    # SPA fallback for application routes only.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        try_files $uri =404;
    }
}
