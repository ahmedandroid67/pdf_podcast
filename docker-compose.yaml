version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    # Expose port 80 to the Docker network so Coolify's reverse proxy can reach it.
    expose:
      - "80"
    labels:
      - "coolify.managed=true"
      - "coolify.service.type=compose"
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Do NOT use env_file here — Coolify injects environment variables directly.
    # The .env file is excluded from the image (.dockerignore) and does not exist
    # on the Coolify host, so env_file would cause the container to fail to start.
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - REDIRECT_URI=${REDIRECT_URI}
      - FRONTEND_URL=${FRONTEND_URL}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
    # Expose port 8000 to the Docker internal network so the frontend nginx can proxy to it.
    expose:
      - "8000"
    volumes:
      - audio_data:/app/static/audio
      - storage_data:/app/storage
    restart: always

volumes:
  audio_data:
  storage_data:
