version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    expose:
      - "80"
    # Do NOT add manual Traefik labels here.
    # Coolify auto-generates Traefik routing labels based on the
    # "Domains for frontend" field in the Coolify UI.
    # Manual labels CONFLICT with Coolify's auto-generated ones and cause
    # "no available server" errors due to service name mismatches.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Coolify injects environment variables directly from its UI panel.
    # Do NOT use env_file — .env is gitignored and does not exist on the Coolify host.
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - REDIRECT_URI=${REDIRECT_URI}
      - FRONTEND_URL=${FRONTEND_URL}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - audio_data:/app/static/audio
      - storage_data:/app/storage
    restart: always

volumes:
  audio_data:
  storage_data:
