version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    expose:
      - "80"
    labels:
      - "coolify.managed=true"
      - "coolify.service.type=compose"
      # Tell Traefik exactly which port inside this container to forward traffic to.
      # Without this, Traefik returns "no available server" even when the container is healthy.
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Coolify injects environment variables directly from its UI panel.
    # Do NOT use env_file — .env is gitignored and does not exist on the Coolify host.
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - REDIRECT_URI=${REDIRECT_URI}
      - FRONTEND_URL=${FRONTEND_URL}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
    expose:
      - "8000"
    volumes:
      - audio_data:/app/static/audio
      - storage_data:/app/storage
    restart: always

volumes:
  audio_data:
  storage_data:
