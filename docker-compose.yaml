version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    expose:
      - "80"
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.docker.network=coolify-proxy"
      # This tells Traefik to route your domain to this service
      - "traefik.http.routers.pdf-frontend.rule=Host(`pdfpodcast.laaraichi.com`)"
      - "traefik.http.routers.pdf-frontend.entrypoints=websecure"
      - "traefik.http.routers.pdf-frontend.tls=true"
      - "traefik.http.services.pdf-frontend.loadbalancer.server.port=80"
    # REMOVED healthcheck from compose to avoid "unhealthy" status blocking Traefik
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - REDIRECT_URI=${REDIRECT_URI}
      - FRONTEND_URL=${FRONTEND_URL}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
    expose:
      - "8000"
    # REMOVED healthcheck from compose
    volumes:
      - audio_data:/app/static/audio
      - storage_data:/app/storage
    restart: always

volumes:
  audio_data:
  storage_data:
