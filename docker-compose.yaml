version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    # Port for manual access (via IP)
    ports:
      - "3015:80"
    # Labels for Coolify (Traefik) to route the domain to the frontend
    labels:
      - "coolify.managed=true"
      - "coolify.service.type=compose"
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - audio_data:/app/static/audio
    restart: always

volumes:
  audio_data:
